name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.23.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run lint
        run: pnpm lint

      - name: Validate docs
        run: pnpm docs:validate

      - name: Check deprecated entrypoints
        run: pnpm verify:deprecated-entrypoints

      - name: Verify runtime package readiness
        run: pnpm verify:runtime-packages

      - name: Verify runtime package install smoke
        run: pnpm verify:runtime-packages:install

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm -r --if-present build

      - name: Verify scripts build is in sync with source
        run: |
          npx tsc -p scripts/lib/tsconfig.json
          npx tsc -p scripts/tsconfig.json
          git diff --exit-code scripts

      - name: Run tests
        run: pnpm test
        env:
          FORGEFLOW_DISPATCHER_DIST_PREBUILT: '1'

      - name: Run critical coverage
        run: pnpm coverage:critical
        env:
          FORGEFLOW_DISPATCHER_DIST_PREBUILT: '1'

      - name: Upload critical coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-coverage-${{ github.run_id }}-${{ github.sha }}
          path: coverage/
          if-no-files-found: error

      - name: Check git diff
        run: git diff --check
