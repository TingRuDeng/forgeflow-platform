name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "workspace package name, for example trae-beta-runtime"
        required: true
        type: choice
        options:
          - automation-gateway-core
          - beta-runtime-core
          - codex-beta-runtime
          - forgeflow-dispatcher
          - gemini-beta-runtime
          - trae-beta-runtime
          - worker-review-orchestrator-cli
      bump:
        description: "version bump type"
        required: true
        default: prerelease
        type: choice
        options:
          - major
          - minor
          - patch
          - prerelease
      tag:
        description: "npm dist-tag"
        required: true
        default: beta
        type: string
  push:
    branches: [main]
    paths:
      - 'packages/*/package.json'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has-packages: ${{ steps.detect.outputs.has-packages }}
      new-packages: ${{ steps.detect.outputs.new-packages }}
      has-new-packages: ${{ steps.detect.outputs.has-new-packages }}
      release-sha: ${{ steps.detect.outputs.release-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Detect packages needing release
        id: detect
        run: |
          REPORT_JSON="$RUNNER_TEMP/release-packages.json"
          node scripts/detect-release-packages.mjs --json --require-known > "$REPORT_JSON"
          jq -r '.rows[] | "- \(.name)@\(.version) action=\(.action)"' "$REPORT_JSON"
          PACKAGES=$(jq -c '.packages' "$REPORT_JSON")
          NEW_PACKAGES=$(jq -c '.newPackages' "$REPORT_JSON")
          
          echo "release-sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "new-packages=$NEW_PACKAGES" >> $GITHUB_OUTPUT
          if [ "$PACKAGES" != "[]" ]; then
            echo "has-packages=true" >> $GITHUB_OUTPUT
          else
            echo "has-packages=false" >> $GITHUB_OUTPUT
          fi
          if [ "$NEW_PACKAGES" != "[]" ]; then
            echo "has-new-packages=true" >> $GITHUB_OUTPUT
          else
            echo "has-new-packages=false" >> $GITHUB_OUTPUT
          fi

  publish-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_PACKAGE: ${{ inputs.package }}
      RELEASE_BUMP: ${{ inputs.bump }}
      NPM_DIST_TAG: ${{ inputs.tag }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    permissions:
      contents: write
      id-token: write
      issues: write
    steps:
      - name: Require main release ref
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Manual releases must run from main; got ${RELEASE_REF}" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify release checkout
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if [[ "$CURRENT_SHA" != "$RELEASE_SHA" ]]; then
            echo "Release checkout mismatch: expected $RELEASE_SHA, got $CURRENT_SHA" >&2
            exit 1
          fi

      - name: Validate release inputs
        run: node scripts/validate-release-inputs.mjs "$RELEASE_PACKAGE" "$NPM_DIST_TAG"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11.12.1
          npm --version

      - name: Release preflight
        env:
          NPM_TRUSTED_PUBLISHING_ENABLED: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED }}
        run: >
          node scripts/release-publish-preflight.mjs
          --package-dir "packages/${RELEASE_PACKAGE}"
          --expected-repo "$RELEASE_REPOSITORY"
          --require-trusted-publishing
          --require-package-exists
          --require-published-workspace-deps

      - name: Check deprecated entrypoints
        run: pnpm verify:deprecated-entrypoints

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run typecheck
        run: pnpm typecheck

      - name: Verify runtime package readiness
        run: pnpm verify:runtime-packages

      - name: Verify runtime package install smoke
        run: pnpm verify:runtime-packages:install

      - name: Run tests
        run: pnpm --filter "@tingrudeng/${RELEASE_PACKAGE}..." --if-present test

      - name: Run shadow drift gate
        run: pnpm verify:shadow-drift

      - name: Bump package version
        run: |
          cd "packages/${RELEASE_PACKAGE}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [[ "$RELEASE_BUMP" == "prerelease" ]]; then
            if [[ "$CURRENT_VERSION" == *"-beta."* ]]; then
              BASE="${CURRENT_VERSION%%-beta.*}"
              PRE="${CURRENT_VERSION##*-beta.}"
              NEW_VERSION="${BASE}-beta.$((PRE + 1))"
            else
              NEW_VERSION="${CURRENT_VERSION}-beta.1"
            fi
          else
            # Strip prerelease suffix first
            CLEAN="${CURRENT_VERSION%%-beta.*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
            case "$RELEASE_BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi
          npm version "$NEW_VERSION" --no-git-tag-version --no-commit-hooks
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "📦 ${RELEASE_PACKAGE}: $CURRENT_VERSION → $NEW_VERSION"

      - name: Verify bumped version is available
        run: >
          node scripts/release-publish-preflight.mjs
          --package-dir "packages/${RELEASE_PACKAGE}"
          --expected-repo "$RELEASE_REPOSITORY"
          --expected-dist-tag "$NPM_DIST_TAG"
          --require-version-available

      - name: Build package
        run: pnpm --filter "@tingrudeng/${RELEASE_PACKAGE}" build

      - name: Prepare exact release tarball
        id: release-artifact
        run: |
          RELEASE_MANIFEST="$RUNNER_TEMP/release-artifact.json"
          node scripts/prepare-release-tarball.mjs \
            --package-dir "packages/${RELEASE_PACKAGE}" \
            --output-dir "$RUNNER_TEMP/release-tarballs" \
            --manifest "$RELEASE_MANIFEST"
          echo "tarball=$(jq -r '.tarball' "$RELEASE_MANIFEST")" >> "$GITHUB_OUTPUT"

      - name: Require unchanged main and publish exact tarball
        id: publish
        env:
          GITHUB_ACTIONS: "true"
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_TARBALL: ${{ steps.release-artifact.outputs.tarball }}
        run: |
          git fetch --no-tags origin main
          REMOTE_MAIN=$(git rev-parse origin/main)
          if [[ "$REMOTE_MAIN" != "$RELEASE_SHA" ]]; then
            echo "main advanced before publish: expected $RELEASE_SHA, got $REMOTE_MAIN" >&2
            exit 1
          fi
          npm publish "$RELEASE_TARBALL" --ignore-scripts --access public --provenance --tag "$NPM_DIST_TAG"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✅ Published @tingrudeng/${RELEASE_PACKAGE}@${NEW_VERSION}"

      - name: Verify exact registry tarball
        run: >
          node scripts/verify-published-package-tarball.mjs
          --package "$RELEASE_PACKAGE"
          --version "$NEW_VERSION"
          --expected-dist-tag "$NPM_DIST_TAG"
          --expected-manifest "$RUNNER_TEMP/release-artifact.json"

      - name: Verify main remained unchanged during publish
        run: |
          git fetch --no-tags origin main
          REMOTE_MAIN=$(git rev-parse origin/main)
          if [[ "$REMOTE_MAIN" != "$RELEASE_SHA" ]]; then
            echo "main advanced during publish: expected $RELEASE_SHA, got $REMOTE_MAIN" >&2
            exit 1
          fi

      - name: Verify published provider runtime smoke
        run: >
          node scripts/verify-published-runtime-smoke.mjs
          --package "$RELEASE_PACKAGE"
          --require-published

      - name: Record published package version in git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "packages/${RELEASE_PACKAGE}/package.json"
          git diff --cached --quiet && {
            echo "No package.json version change to record after publish"
            exit 1
          }
          git commit -m "chore(release): 发布 @tingrudeng/${RELEASE_PACKAGE}@${NEW_VERSION} [skip actions]"
          git tag -a "release/${RELEASE_PACKAGE}@${NEW_VERSION}" -m "release @tingrudeng/${RELEASE_PACKAGE}@${NEW_VERSION}"
          git push origin "HEAD:main" --follow-tags

      - name: Summarize post-publish git recovery
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        run: |
          {
            echo "## 手动发布需要恢复"
            echo ""
            echo "npm publish 已成功，但 git commit/tag/push 记录失败。"
            echo ""
            echo "- package: @tingrudeng/${RELEASE_PACKAGE}"
            echo "- version: ${NEW_VERSION}"
            echo "- tag: release/${RELEASE_PACKAGE}@${NEW_VERSION}"
            echo ""
            echo "恢复方式：确认 npm 上该版本存在后，在 main 上补交 packages/${RELEASE_PACKAGE}/package.json 的版本变更，并创建同名 release tag。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 创建发布后 git 恢复 issue
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION="$NEW_VERSION"
          RELEASE_TAG="release/${RELEASE_PACKAGE}@${RELEASE_VERSION}"
          ISSUE_BODY="$RUNNER_TEMP/release-recovery-issue.md"
          cat > "$ISSUE_BODY" <<EOF
          npm publish 已成功，但 git commit / tag / push 记录失败，需要人工补齐版本记录。

          - package: @tingrudeng/${RELEASE_PACKAGE}
          - version: ${RELEASE_VERSION}
          - tag: ${RELEASE_TAG}
          - workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          恢复方式：
          1. 确认 npm 上 @tingrudeng/${RELEASE_PACKAGE}@${RELEASE_VERSION} 已存在。
          2. 在 main 上补交 packages/${RELEASE_PACKAGE}/package.json 的版本变更。
          3. 创建同名 release tag：${RELEASE_TAG}。
          4. 推送 commit 和 tag 后关闭本 issue。
          EOF
          gh issue create \
            --title "手动发布需要恢复：@tingrudeng/${RELEASE_PACKAGE}@${RELEASE_VERSION}" \
            --body-file "$ISSUE_BODY"

  publish-disabled-summary:
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.has-packages == 'true' && vars.NPM_TRUSTED_PUBLISHING_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Release disabled summary
        run: |
          echo "## Auto Release Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detected package version changes, but trusted publishing is intentionally gated off." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To enable auto publish:" >> "$GITHUB_STEP_SUMMARY"
          echo "- configure npm Trusted Publisher for repo \`${{ github.repository }}\` and the target \`@tingrudeng/*\` packages" >> "$GITHUB_STEP_SUMMARY"
          echo "- set repository/org variable \`NPM_TRUSTED_PUBLISHING_ENABLED=true\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pending package set:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ needs.detect-changes.outputs.packages }}' | jq -r '.[] | "- \(.name)@\(.version)"' >> "$GITHUB_STEP_SUMMARY"

  publish-setup-required-summary:
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.has-new-packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 输出全新包名配置缺口
        run: |
          echo "## 自动发布等待 npm 包名配置" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "检测到仓库里有 @tingrudeng scope 的全新包名，但这些包名尚不存在于 npm registry。" >> "$GITHUB_STEP_SUMMARY"
          echo "自动发布只处理已完成 npm 包名和 Trusted Publisher 配置的包；全新包名需要先完成人工配置，避免发布阶段才以 E404 失败。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "待配置包：" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ needs.detect-changes.outputs.new-packages }}' | jq -r '.[] | "- @tingrudeng/\(.name)@\(.version)"' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "处理方式：" >> "$GITHUB_STEP_SUMMARY"
          echo "- 在 npm 为上述包名完成首次创建或权限确认。" >> "$GITHUB_STEP_SUMMARY"
          echo "- 为仓库 \`${{ github.repository }}\` 配置对应包的 Trusted Publisher。" >> "$GITHUB_STEP_SUMMARY"
          echo "- 配置完成后，后续版本变更会重新进入自动发布矩阵。" >> "$GITHUB_STEP_SUMMARY"

  publish-auto:
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.has-packages == 'true' && vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_PACKAGE: ${{ matrix.package.name }}
      RELEASE_VERSION: ${{ matrix.package.version }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_SHA: ${{ needs.detect-changes.outputs.release-sha }}
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect-changes.outputs.release-sha }}

      - name: Verify detected release identity
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          CURRENT_VERSION=$(node -p "require('./packages/${RELEASE_PACKAGE}/package.json').version")
          if [[ "$CURRENT_SHA" != "$RELEASE_SHA" ]]; then
            echo "Release checkout mismatch: expected $RELEASE_SHA, got $CURRENT_SHA" >&2
            exit 1
          fi
          if [[ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "Release version mismatch: expected $RELEASE_VERSION, got $CURRENT_VERSION" >&2
            exit 1
          fi

      - name: Validate release package
        run: node scripts/validate-release-inputs.mjs "$RELEASE_PACKAGE" beta

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11.12.1
          npm --version

      - name: Release preflight
        id: preflight
        env:
          NPM_TRUSTED_PUBLISHING_ENABLED: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED }}
        run: >
          node scripts/release-publish-preflight.mjs
          --package-dir "packages/${RELEASE_PACKAGE}"
          --expected-repo "$RELEASE_REPOSITORY"
          --require-trusted-publishing
          --require-package-exists
          --require-version-available
          --require-published-workspace-deps

      - name: Check deprecated entrypoints
        run: pnpm verify:deprecated-entrypoints

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run lint
        run: pnpm lint

      - name: Validate docs
        run: pnpm docs:validate

      - name: Run typecheck
        run: pnpm typecheck

      - name: Verify runtime package readiness
        run: pnpm verify:runtime-packages

      - name: Verify runtime package install smoke
        run: pnpm verify:runtime-packages:install

      - name: Run tests
        run: pnpm --filter "@tingrudeng/${RELEASE_PACKAGE}..." --if-present test

      - name: Run shadow drift gate
        run: pnpm verify:shadow-drift

      - name: Build package
        run: pnpm --filter "@tingrudeng/${RELEASE_PACKAGE}" build

      - name: Prepare exact release tarball
        id: release-artifact
        run: |
          RELEASE_MANIFEST="$RUNNER_TEMP/release-artifact.json"
          node scripts/prepare-release-tarball.mjs \
            --package-dir "packages/${RELEASE_PACKAGE}" \
            --output-dir "$RUNNER_TEMP/release-tarballs" \
            --manifest "$RELEASE_MANIFEST"
          echo "tarball=$(jq -r '.tarball' "$RELEASE_MANIFEST")" >> "$GITHUB_OUTPUT"

      - name: Require unchanged main and publish exact tarball
        id: publish
        env:
          GITHUB_ACTIONS: "true"
          NPM_DIST_TAG: ${{ steps.preflight.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_TARBALL: ${{ steps.release-artifact.outputs.tarball }}
        run: |
          git fetch --no-tags origin main
          REMOTE_MAIN=$(git rev-parse origin/main)
          if [[ "$REMOTE_MAIN" != "$RELEASE_SHA" ]]; then
            echo "main advanced before publish: expected $RELEASE_SHA, got $REMOTE_MAIN" >&2
            exit 1
          fi
          npm publish "$RELEASE_TARBALL" --ignore-scripts --access public --provenance --tag "$NPM_DIST_TAG"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✅ Published @tingrudeng/${RELEASE_PACKAGE}@${RELEASE_VERSION}"

      - name: Verify exact registry tarball
        env:
          EXPECTED_DIST_TAG: ${{ steps.preflight.outputs.dist_tag }}
        run: >
          node scripts/verify-published-package-tarball.mjs
          --package "$RELEASE_PACKAGE"
          --version "$RELEASE_VERSION"
          --expected-dist-tag "$EXPECTED_DIST_TAG"
          --expected-manifest "$RUNNER_TEMP/release-artifact.json"

      - name: Verify main remained unchanged during publish
        run: |
          git fetch --no-tags origin main
          REMOTE_MAIN=$(git rev-parse origin/main)
          if [[ "$REMOTE_MAIN" != "$RELEASE_SHA" ]]; then
            echo "main advanced during publish: expected $RELEASE_SHA, got $REMOTE_MAIN" >&2
            exit 1
          fi

      - name: Verify published provider runtime smoke
        run: >
          node scripts/verify-published-runtime-smoke.mjs
          --package "$RELEASE_PACKAGE"
          --require-published

      - name: Summarize automatic post-publish recovery
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        run: |
          {
            echo "## 自动发布后验证失败"
            echo ""
            echo "npm publish 已成功，但后续 registry、main identity 或 provider smoke 验证失败。"
            echo ""
            echo "- package: @tingrudeng/${RELEASE_PACKAGE}"
            echo "- version: ${RELEASE_VERSION}"
            echo "- release sha: ${RELEASE_SHA}"
            echo "- workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "请先确认 npm 上的精确版本、dist-tag 与 tarball，再按本次 workflow 日志处理 main 漂移或 smoke 失败。"
          } >> "$GITHUB_STEP_SUMMARY"
